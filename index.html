      if (!Hitung.hariKerja(set, t)) continue;
      st = Hitung.statusHari(D, s, t, nowMs);
      if (st === 'izin' || st === 'sakit') continue;
      var j = (D.Jurnal || []).filter(function (x) { return x.siswa_id === s.id && x.tanggal === t && x.status !== 'draf'; })[0];
      if (j) break;
      kosong++;
    }
    var level = 0, alasan = '';
    if (alpaAll >= 3 || kosong >= 5) { level = 3; alasan = alpaAll >= 3 ? 'Alpa ' + alpaAll + ' kali' : 'Jurnal kosong ' + kosong + ' hari'; }
    else if (telatMg >= 3 || alpaMg >= 1) { level = 2; alasan = alpaMg >= 1 ? 'Alpa minggu ini' : 'Terlambat ' + telatMg + ' kali minggu ini'; }
    else if (any7 >= 1) { level = 1; alasan = 'Ada keterlambatan atau alpa'; }
    return { level: level, alasan: alasan, telatMg: telatMg, alpaMg: alpaMg, alpaAll: alpaAll, kosong: kosong };
  },
  statusCek: function (c, nowMs) {
    if (c.status === 'menunggu' && nowMs > Number(c.batas)) return 'tidak_merespons';
    return c.status;
  }
};

/* ============================================================
   createCore(db, env)
   db  : { all(tabel)->array, put(tabel,row), del(tabel,id) }  (sinkron)
   env : { now(), hash(str), uid(), fotoSimpan(dataUrl)->ref, fotoBaca(ref)->dataUrl }
   ============================================================ */
function createCore(db, env) {
  var R = {};
  function ok(d) { return { ok: true, data: d === undefined ? {} : d }; }
  function err(m, kode) { return { ok: false, error: m, kode: kode || '' }; }
  function now() { return env.now(); }
  function byId(t, id) { var a = db.all(t), i; for (i = 0; i < a.length; i++) if (a[i].id === id) return a[i]; return null; }
  function hs(x) { return env.hash('pkl|' + x); }
  function uniq(a) { return a.filter(function (x, i) { return x && a.indexOf(x) === i; }); }
  function isStaff(u) { return u.peran === 'waka' || u.peran === 'admin'; }
  function aktif(u) { return u && String(u.aktif) !== '0'; }
  function setting() { return Hitung.set({ Pengaturan: db.all('Pengaturan') }); }
  function wajib(p, keys) { for (var i = 0; i < keys.length; i++) if (p[keys[i]] === undefined || p[keys[i]] === '' || p[keys[i]] === null) return keys[i]; return null; }

  function auth(token) {
    if (!token) return null;
    var s = byId('Sesi', token);
    if (!s || Number(s.exp) < now()) return null;
    var u = byId('Pengguna', s.user_id);
    return aktif(u) ? u : null;
  }
  function buatSesi(u) {
    var t = env.uid() + env.uid() + env.uid();
    db.put('Sesi', { id: t, user_id: u.id, exp: now() + 14 * 864e5 });
    return t;
  }
  function publik(u) { return { id: u.id, nama: u.nama, peran: u.peran, nowa: u.nowa }; }

  function lingkup(u) {
    var S = db.all('Siswa'), Dd = db.all('DUDI');
    if (isStaff(u)) return S;
    if (u.peran === 'guru') return S.filter(function (s) { return s.guru_id === u.id; });
    if (u.peran === 'industri') {
      var ids = Dd.filter(function (d) { return d.pembimbing_id === u.id; }).map(function (d) { return d.id; });
      return S.filter(function (s) { return ids.indexOf(s.dudi_id) >= 0; });
    }
    if (u.peran === 'siswa') return S.filter(function (s) { return s.id === u.id; });
    if (u.peran === 'ortu') return S.filter(function (s) { return s.ortu_id === u.id; });
    return [];
  }
  function bolehSiswa(u, sid) { return lingkup(u).some(function (s) { return s.id === sid; }); }
  function dudiMilik(u) { return db.all('DUDI').filter(function (d) { return d.pembimbing_id === u.id; }).map(function (d) { return d.id; }); }

  /* ---------- Sesi ---------- */
  R.login = function (_u, p) {
    var u = byId('Pengguna', String(p.id || '').trim());
    if (!aktif(u) || u.sandi !== hs(p.sandi || '')) return err('ID atau kata sandi salah.');
    if (u.peran === 'siswa') {
      if (!p.device) return err('Perangkat tidak dikenali.');
      if (!u.device) { u.device = p.device; db.put('Pengguna', u); }
      else if (u.device !== p.device) return err('Akun ini terkunci ke HP lain. Minta admin sekolah mereset perangkat.', 'device');
    }
    return ok({ token: buatSesi(u), user: publik(u) });
  };
  R.loginToken = function (_u, p) {
    var u = db.all('Pengguna').filter(function (x) { return x.tautan && x.tautan === p.tautan; })[0];
    if (!aktif(u)) return err('Tautan tidak berlaku. Minta tautan baru ke sekolah.');
    return ok({ token: buatSesi(u), user: publik(u) });
  };
  R.logout = function (u, p, token) { db.del('Sesi', token); return ok(); };

  R.bootstrap = function (u) {
    var S = lingkup(u), sid = S.map(function (s) { return s.id; }), staff = isStaff(u);
    function inS(r) { return sid.indexOf(r.siswa_id) >= 0; }
    var dIds = staff ? null : uniq(S.map(function (s) { return s.dudi_id; }).concat(u.peran === 'industri' ? dudiMilik(u) : []));
    var DU = db.all('DUDI').filter(function (d) { return staff || dIds.indexOf(d.id) >= 0; });
    var kun = db.all('Kunjungan').filter(function (k) {
      return staff || (u.peran === 'guru' && k.guru_id === u.id) || (u.peran === 'industri' && dIds.indexOf(k.dudi_id) >= 0);
    });
    var kunIds = kun.map(function (k) { return k.id; });
    var tin = (staff || u.peran === 'guru') ? db.all('Tindak').filter(function (t) { return kunIds.indexOf(t.kunjungan_id) >= 0 || staff; }) : [];
    var ids = {};
    ids[u.id] = 1;
    if (staff) db.all('Pengguna').forEach(function (x) { ids[x.id] = 1; });
    else {
      S.forEach(function (s) { ids[s.id] = 1; ids[s.guru_id] = 1; ids[s.ortu_id] = 1; });
      DU.forEach(function (d) { ids[d.pembimbing_id] = 1; });
      if (u.peran === 'guru' || u.peran === 'industri') { /* hanya yang relevan */ }
    }
    var us = db.all('Pengguna').filter(function (x) { return ids[x.id]; }).map(function (x) {
      var o = publik(x);
      if (staff) { o.tautan = x.tautan; o.device = x.device ? 1 : 0; o.aktif = x.aktif; }
      return o;
    });
    var tampilNilai = u.peran !== 'ortu';
    return ok({
      now: now(), me: publik(u), set: setting(),
      Pengguna: us, Siswa: S, DUDI: DU,
      Absensi: db.all('Absensi').filter(inS), Jurnal: db.all('Jurnal').filter(inS), Izin: db.all('Izin').filter(inS),
      Catatan: db.all('Catatan').filter(inS), CekLokasi: db.all('CekLokasi').filter(inS), SOS: db.all('SOS').filter(inS),
      Nilai: tampilNilai ? db.all('Nilai').filter(inS) : [],
      Pengesahan: db.all('Pengesahan').filter(function (x) { return staff || (dIds && dIds.indexOf(x.dudi_id) >= 0); }),
      Kunjungan: kun, Tindak: tin, Pengaturan: db.all('Pengaturan')
    });
  };
  R.foto = function (u, p) {
    if (u.peran === 'ortu') return err('Tidak diizinkan.');
    return ok({ data: env.fotoBaca(p.ref) });
  };

  /* ---------- Siswa: absen, jurnal, izin, SOS ---------- */
  R.absen = function (u, p) {
    if (u.peran !== 'siswa') return err('Hanya siswa yang dapat absen.');
    var s = byId('Siswa', u.id), d = s && byId('DUDI', s.dudi_id);
    if (!s || !d) return err('Penempatan PKL belum diatur. Hubungi panitia.');
    if (p.lat == null || p.lng == null) return err('Lokasi belum terbaca.');
    if (!p.foto) return err('Foto selfie wajib.');
    var t = now(), tgl = tglOf(t), jam = jamOf(t), set = setting();
    if (s.mulai && tgl < s.mulai) return err('PKL kamu belum dimulai.');
    if (s.selesai && tgl > s.selesai) return err('Masa PKL sudah selesai.');
    var iz = db.all('Izin').filter(function (x) { return x.siswa_id === u.id && x.tanggal === tgl && x.status === 'disetujui'; })[0];
    if (iz) return err('Hari ini tercatat ' + iz.jenis + '.');
    var id = u.id + '_' + tgl, a = byId('Absensi', id);
    var jarak = jarakM(+p.lat, +p.lng, +d.lat, +d.lng), radius = Number(d.radius) || set.radius_default;
    var acc = p.acc == null ? null : Number(p.acc);
    var palsu = (p.palsu || (acc !== null && acc < 1)) ? 1 : 0;
    var luar = jarak > radius;
    var verif = (luar || palsu) ? 'menunggu' : '';
    if (p.tipe === 'masuk') {
      if (a && a.jam_masuk) return err('Kamu sudah absen masuk hari ini.');
      var telat = Math.max(0, menit(jam) - menit(d.jam_masuk));
      a = {
        id: id, siswa_id: u.id, tanggal: tgl, jam_masuk: jam, jam_pulang: '', lat: +p.lat, lng: +p.lng, jarak: jarak,
        akurasi: acc == null ? 0 : acc, foto_masuk: env.fotoSimpan(p.foto), foto_pulang: '', status: telat > 0 ? 'terlambat' : 'hadir',
        menit_telat: telat, palsu: palsu, verif: verif
      };
      db.put('Absensi', a);
      return ok({ absen: a, luar: luar, palsu: !!palsu });
    }
    if (p.tipe === 'pulang') {
      if (!a || !a.jam_masuk) return err('Kamu belum absen masuk hari ini.');
      if (a.jam_pulang) return err('Kamu sudah absen pulang.');
      a.jam_pulang = jam; a.foto_pulang = env.fotoSimpan(p.foto);
      if (luar || palsu) a.verif = 'menunggu';
      db.put('Absensi', a);
      return ok({ absen: a, luar: luar, palsu: !!palsu });
    }
    return err('Jenis absen tidak dikenal.');
  };

  function kalimat(t) { return String(t || '').split(/[.!?\n]+/).map(function (x) { return x.trim(); }).filter(function (x) { return x.length >= 3; }).length; }
  R.jurnalSimpan = function (u, p) {
    if (u.peran !== 'siswa') return err('Hanya siswa.');
    var tgl = p.tanggal || tglOf(now());
    if (tgl > tglOf(now())) return err('Tanggal jurnal belum tiba.');
    var id = u.id + '_' + tgl, ex = byId('Jurnal', id), set = setting();
    if (ex && ex.status === 'disahkan') return err('Jurnal ini sudah disahkan dan tidak bisa diubah.');
    if (ex && ex.status === 'diajukan') return err('Jurnal sedang menunggu pengesahan.');
    var komp = (p.kompetensi || []).slice(0, 6), fotos = (p.fotos || []).slice(0, 6).map(function (f) { return /^data:/.test(f) ? env.fotoSimpan(f) : f; });
    if (p.ajukan) {
      if (kalimat(p.uraian) < set.min_kalimat) return err('Uraian kegiatan minimal ' + set.min_kalimat + ' kalimat.');
      if (!komp.length) return err('Pilih minimal satu kompetensi yang dilatih.');
      if (!fotos.length) return err('Tambahkan minimal 1 foto kegiatan.');
    }
    var row = {
      id: id, siswa_id: u.id, tanggal: tgl, uraian: String(p.uraian || '').slice(0, 3000), kompetensi: komp,
      kendala: String(p.kendala || '').slice(0, 1500), fotos: fotos, status: p.ajukan ? 'diajukan' : (ex && ex.status === 'perlu revisi' ? 'perlu revisi' : 'draf'),
      disahkan_oleh: '', disahkan_pada: '', diubah: now()
    };
    if (p.ajukan) row.status = 'diajukan';
    db.put('Jurnal', row);
    return ok({ jurnal: row });
  };

  R.izinAjukan = function (u, p) {
    if (u.peran !== 'siswa') return err('Hanya siswa.');
    var miss = wajib(p, ['tanggal', 'jenis', 'alasan']);
    if (miss) return err('Lengkapi isian: ' + miss + '.');
    if (['izin', 'sakit'].indexOf(p.jenis) < 0) return err('Jenis harus izin atau sakit.');
    if (p.tanggal < addHari(tglOf(now()), -3)) return err('Pengajuan melewati batas 3 hari ke belakang.');
    var id = u.id + '_' + p.tanggal, ex = byId('Izin', id);
    if (ex && ex.status === 'disetujui') return err('Tanggal itu sudah disetujui.');
    var row = {
      id: id, siswa_id: u.id, tanggal: p.tanggal, jenis: p.jenis, alasan: String(p.alasan).slice(0, 500),
      lampiran: p.lampiran ? (/^data:/.test(p.lampiran) ? env.fotoSimpan(p.lampiran) : p.lampiran) : '', status: 'menunggu', diputus_oleh: '', dibuat: now()
    };
    db.put('Izin', row);
    return ok({ izin: row });
  };
  R.izinPutus = function (u, p) {
    if (u.peran !== 'guru' && !isStaff(u)) return err('Tidak diizinkan.');
    var iz = byId('Izin', p.id);
    if (!iz || !bolehSiswa(u, iz.siswa_id)) return err('Data tidak ditemukan.');
    if (['disetujui', 'ditolak'].indexOf(p.status) < 0) return err('Status tidak valid.');
    iz.status = p.status; iz.diputus_oleh = u.id; db.put('Izin', iz);
    return ok({ izin: iz });
  };
  R.verifPutus = function (u, p) {
    if (u.peran !== 'guru' && !isStaff(u)) return err('Tidak diizinkan.');
    var a = byId('Absensi', p.id);
    if (!a || !bolehSiswa(u, a.siswa_id)) return err('Data tidak ditemukan.');
    a.verif = p.setuju ? 'setuju' : 'tolak';
    if (!p.setuju) a.status = 'alpa';
    db.put('Absensi', a);
    return ok({ absen: a });
  };

  R.sosKirim = function (u, p) {
    if (u.peran !== 'siswa') return err('Hanya siswa.');
    var s = byId('Siswa', u.id), pen = [];
    var guru = s && byId('Pengguna', s.guru_id), ortu = s && byId('Pengguna', s.ortu_id);
    if (guru) pen.push(guru.nama);
    pen.push('Panitia PKL');
    if (ortu) pen.push('Orang tua');
    var row = { id: env.uid(), siswa_id: u.id, waktu: now(), lat: p.lat == null ? '' : +p.lat, lng: p.lng == null ? '' : +p.lng, status: 'terbuka', ditangani_oleh: '', catatan: '', penerima: pen };
    db.put('SOS', row);
    return ok({ sos: row });
  };
  R.sosTangani = function (u, p) {
    if (u.peran === 'siswa' || u.peran === 'ortu' || u.peran === 'industri') return err('Tidak diizinkan.');
    var x = byId('SOS', p.id);
    if (!x || !bolehSiswa(u, x.siswa_id)) return err('Data tidak ditemukan.');
    x.status = 'ditangani'; x.ditangani_oleh = u.id; x.catatan = String(p.catatan || '').slice(0, 500);
    db.put('SOS', x);
    return ok({ sos: x });
  };

  /* ---------- Pembimbing industri & guru: pengesahan, catatan, nilai ---------- */
  R.sahkan = function (u, p) {
    if (u.peran !== 'industri' && !isStaff(u)) return err('Tidak diizinkan.');
    if (u.peran === 'industri' && dudiMilik(u).indexOf(p.dudi_id) < 0) return err('Bukan perusahaan Anda.');
    var akhir = addHari(p.minggu, 6), n = 0, sids = db.all('Siswa').filter(function (s) { return s.dudi_id === p.dudi_id; }).map(function (s) { return s.id; });
    db.all('Jurnal').forEach(function (j) {
      if (sids.indexOf(j.siswa_id) >= 0 && j.tanggal >= p.minggu && j.tanggal <= akhir && j.status === 'diajukan') {
        j.status = 'disahkan'; j.disahkan_oleh = u.id; j.disahkan_pada = now(); db.put('Jurnal', j); n++;
      }
    });
    if (!n) return err('Tidak ada jurnal yang menunggu pengesahan pada minggu ini.');
    db.put('Pengesahan', { id: p.dudi_id + '_' + p.minggu, dudi_id: p.dudi_id, minggu: p.minggu, oleh: u.id, waktu: now() });
    return ok({ disahkan: n });
  };
  R.jurnalRevisi = function (u, p) {
    if (['industri', 'guru', 'waka', 'admin'].indexOf(u.peran) < 0) return err('Tidak diizinkan.');
    var j = byId('Jurnal', p.id);
    if (!j || !bolehSiswa(u, j.siswa_id)) return err('Data tidak ditemukan.');
    if (j.status === 'disahkan') return err('Jurnal sudah disahkan.');
    if (!String(p.catatan || '').trim()) return err('Tulis catatan revisi.');
    j.status = 'perlu revisi'; db.put('Jurnal', j);
    db.put('Catatan', { id: env.uid(), siswa_id: j.siswa_id, ref: j.id, oleh: u.id, teks: String(p.catatan).slice(0, 500), waktu: now(), tipe: 'revisi' });
    return ok();
  };
  R.catat = function (u, p) {
    if (['industri', 'guru', 'waka', 'admin'].indexOf(u.peran) < 0) return err('Tidak diizinkan.');
    if (!bolehSiswa(u, p.siswa_id)) return err('Siswa tidak ditemukan.');
    if (!String(p.teks || '').trim()) return err('Catatan kosong.');
    db.put('Catatan', { id: env.uid(), siswa_id: p.siswa_id, ref: p.ref || '', oleh: u.id, teks: String(p.teks).slice(0, 500), waktu: now(), tipe: p.tipe || 'coretan' });
    return ok();
  };
  R.nilaiSimpan = function (u, p) {
    if (u.peran !== 'industri' && !isStaff(u)) return err('Tidak diizinkan.');
    if (!bolehSiswa(u, p.siswa_id)) return err('Siswa tidak ditemukan.');
    var a = Number(p.sikap), b = Number(p.keterampilan);
    if (!(a >= 0 && a <= 100 && b >= 0 && b <= 100)) return err('Nilai harus 0–100.');
    db.put('Nilai', { id: p.siswa_id, siswa_id: p.siswa_id, sikap: a, keterampilan: b, catatan: String(p.catatan || '').slice(0, 500), oleh: u.id, diubah: now() });
    return ok();
  };

  /* ---------- Kunjungan guru ---------- */
  R.kunjunganJadwal = function (u, p) {
    if (u.peran !== 'guru' && !isStaff(u)) return err('Tidak diizinkan.');
    var miss = wajib(p, ['dudi_id', 'tanggal']);
    if (miss) return err('Lengkapi isian.');
    var gid = isStaff(u) && p.guru_id ? p.guru_id : u.id;
    var row = { id: env.uid(), guru_id: gid, dudi_id: p.dudi_id, tanggal: p.tanggal, waktu: '', lat: '', lng: '', foto: '', checklist: {}, catatan: '', konfirmasi: '', status: 'jadwal' };
    db.put('Kunjungan', row);
    return ok({ kunjungan: row });
  };
  function milikKunjungan(u, id) {
    var k = byId('Kunjungan', id);
    if (!k || (u.peran === 'guru' && k.guru_id !== u.id) || (u.peran !== 'guru' && !isStaff(u))) return null;
    return k;
  }
  R.kunjunganCheckin = function (u, p) {
    var k = milikKunjungan(u, p.id); if (!k) return err('Kunjungan tidak ditemukan.');
    if (p.lat == null) return err('Lokasi belum terbaca.');
    if (!p.foto) return err('Foto di depan tempat PKL wajib.');
    var d = byId('DUDI', k.dudi_id);
    k.lat = +p.lat; k.lng = +p.lng; k.waktu = now(); k.foto = env.fotoSimpan(p.foto); k.status = 'berlangsung';
    db.put('Kunjungan', k);
    var jarak = d ? jarakM(+p.lat, +p.lng, +d.lat, +d.lng) : 0;
    return ok({ kunjungan: k, jarak: jarak, jauh: !!d && jarak > Math.max(Number(d.radius) || 100, 300) });
  };
  R.kunjunganSelesai = function (u, p) {
    var k = milikKunjungan(u, p.id); if (!k) return err('Kunjungan tidak ditemukan.');
    if (k.status !== 'berlangsung') return err('Lakukan check-in dulu.');
    k.checklist = p.checklist || {}; k.catatan = String(p.catatan || '').slice(0, 2000); k.status = 'selesai';
    db.put('Kunjungan', k);
    (p.temuan || []).forEach(function (t) {
      if (!String(t.teks || '').trim()) return;
      db.put('Tindak', { id: env.uid(), kunjungan_id: k.id, dudi_id: k.dudi_id, teks: String(t.teks).slice(0, 300), pj: t.pj || k.guru_id, tenggat: t.tenggat || addHari(tglOf(now()), 7), status: 'baru', dibuat: now() });
    });
    return ok({ kunjungan: k });
  };
  R.kunjunganKonfirmasi = function (u, p) {
    var k = byId('Kunjungan', p.id);
    if (!k || (u.peran !== 'industri' && !isStaff(u)) || (u.peran === 'industri' && dudiMilik(u).indexOf(k.dudi_id) < 0)) return err('Data tidak ditemukan.');
    if (k.status !== 'selesai') return err('Kunjungan belum selesai.');
    k.konfirmasi = now(); db.put('Kunjungan', k);
    return ok();
  };
  R.tindakStatus = function (u, p) {
    if (u.peran !== 'guru' && !isStaff(u)) return err('Tidak diizinkan.');
    var t = byId('Tindak', p.id); if (!t) return err('Data tidak ditemukan.');
    if (['baru', 'diproses', 'selesai'].indexOf(p.status) < 0) return err('Status tidak valid.');
    t.status = p.status; db.put('Tindak', t);
    return ok();
  };

  /* ---------- Cek lokasi mendadak ---------- */
  R.cekKirim = function (u, p) {
    if (u.peran !== 'guru' && !isStaff(u)) return err('Tidak diizinkan.');

/* peta SVG sederhana tanpa pustaka (hemat kuota) */
function petaMini(pts, tinggi) {
  var H = tinggi || 220, W = 520, lats = pts.map(function (p) { return p.lat; }), lngs = pts.map(function (p) { return p.lng; });
  var cLat = (Math.min.apply(0, lats) + Math.max.apply(0, lats)) / 2, cLng = (Math.min.apply(0, lngs) + Math.max.apply(0, lngs)) / 2, k = Math.cos(cLat * Math.PI / 180);
  var mx = Math.max((Math.max.apply(0, lngs) - Math.min.apply(0, lngs)) * k, Math.max.apply(0, lats) - Math.min.apply(0, lats), 0.002) * 1.5, sc = Math.min(W, H) / mx;
  function X(l) { return W / 2 + (l - cLng) * k * sc; } function Y(l) { return H / 2 - (l - cLat) * sc; }
  var out = '<svg class="peta" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Peta lokasi"><defs><pattern id="gr" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="var(--line)" stroke-width="1"/></pattern></defs><rect width="' + W + '" height="' + H + '" fill="url(#gr)"/>';
  pts.forEach(function (p) {
    if (p.r) { var rr = p.r / 111320 * sc; out += '<circle cx="' + X(p.lng) + '" cy="' + Y(p.lat) + '" r="' + rr + '" fill="rgba(20,64,46,.15)" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 4"/>'; }
    out += p.k === 'absen' ? '<path d="M' + (X(p.lng) - 9) + ' ' + (Y(p.lat) - 9) + 'l18 18m0-18l-18 18" stroke="var(--c-alpa)" stroke-width="4"/>' : '<rect x="' + (X(p.lng) - 7) + '" y="' + (Y(p.lat) - 7) + '" width="14" height="14" fill="var(--ink)"/>';
    out += '<text x="' + (X(p.lng) + 12) + '" y="' + (Y(p.lat) - 10) + '" font-size="13" font-family="IBM Plex Mono,monospace" fill="var(--ink)">' + esc(p.label) + '</text>';
  });
  return out + '</svg>';
}

  return siswaList().map(function (s) { var hd = 0, tl = 0, iz = 0, al = 0, x = s.mulai, tj = 0, t = today(); for (; x <= t; x = addHari(x, 1)) { var k = stat(s, x); if (k === 'hadir') hd++; else if (k === 'terlambat') { hd++; tl++; } else if (k === 'izin' || k === 'sakit') iz++; else if (k === 'alpa') al++; var j = jurnalTgl(s.id, x); if (j && j.status !== 'draf') tj++; } var nl = (D().Nilai || []).filter(function (n) { return n.siswa_id === s.id; })[0]; return { s: s, hadir: hd, telat: tl, izin: iz, alpa: al, jurnal: tj, w: Hitung.peringatan(D(), s, nowMs()).level, nilai: nl }; });
}

  return '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px"><h1>Rekap</h1><button class="btn" data-a="ekspor">Ekspor CSV</button></div><div class="filters"><select data-a="fil" data-k="j" aria-label="Jurusan"><option value="">Semua jurusan</option><option' + (f.j === 'TKJ' ? ' selected' : '') + '>TKJ</option><option' + (f.j === 'MPLB' ? ' selected' : '') + '>MPLB</option></select><select data-a="fil" data-k="d" aria-label="DUDI"><option value="">Semua DUDI</option>' + D().DUDI.map(function (d) { return '<option value="' + d.id + '"' + (f.d === d.id ? ' selected' : '') + '>' + esc(d.nama) + '</option>'; }).join('') + '</select><select data-a="fil" data-k="g" aria-label="Guru"><option value="">Semua guru</option>' + Object.keys(gurus).map(function (g) { return '<option value="' + g + '"' + (f.g === g ? ' selected' : '') + '>' + esc(namaU(g)) + '</option>'; }).join('') + '</select></div>' +
    '<div class="scroll-x"><table class="rapat"><thead><tr><th>Nama</th><th>Kelas</th><th>DUDI</th><th>Hadir</th><th>Telat</th><th>Izin</th><th>Alpa</th><th>Jurnal</th><th>Tk</th><th>Nilai</th></tr></thead><tbody>' + R.map(function (r) { return '<tr><td>' + esc(namaS(r.s.id)) + '</td><td>' + esc(r.s.kelas) + '</td><td>' + esc(dudiNama(r.s.dudi_id)) + '</td><td class="mono">' + r.hadir + '</td><td class="mono">' + r.telat + '</td><td class="mono">' + r.izin + '</td><td class="mono">' + r.alpa + '</td><td class="mono">' + r.jurnal + '</td><td class="mono">' + r.w + '</td><td class="mono">' + (r.nilai ? r.nilai.sikap + '/' + r.nilai.keterampilan : '—') + '</td></tr>'; }).join('') + '</tbody></table></div>';
};
